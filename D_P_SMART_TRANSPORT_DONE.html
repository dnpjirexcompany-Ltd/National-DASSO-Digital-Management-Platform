</style></head><body>
<div id="root"></div>
<script>
const RN={passenger:'Umugenzi',company:'Company Admin',agent:'Ticket Agent',driver:'Umushoferi',admin:'National Admin'};
const U={passenger:{p:'pass123',r:'passenger',n:'Umugenzi Demo',ph:'0780000001'},company:{p:'company123',r:'company',n:'Volcano Admin',co:'Volcano Express',ph:'0780000002'},agent:{p:'agent123',r:'agent',n:'Ticket Agent',co:'Volcano Express',ph:'0780000003'},driver:{p:'driver123',r:'driver',n:'Umushoferi',co:'Volcano Express',ph:'0780000004'},admin:{p:'admin123',r:'admin',n:'National Admin',ph:'0780000005'}};
const TABS={passenger:[['book','Gura itike'],['mine','Amatike yanjye'],['prof','Konti yanjye']],agent:[['book','Kugurisha'],['mine','Ibyagurishijwe'],['prof','Konti yanjye']],company:[['dash','Dashboard'],['trips','Amasaha n’ingendo'],['veh','Imodoka'],['drv','Abashoferi'],['agt','Abakozi (Agents)'],['prof','Konti yanjye']],driver:[['trips','Ingendo zanjye'],['prof','Konti yanjye']],admin:[['dash','Dashboard'],['alltrips','Ingendo zose'],['cos','Amasosiyete'],['users','Abakoresha'],['prof','Konti yanjye']]};
const CITIES=['Kigali','Huye','Musanze','Rubavu','Rusizi','Muhanga','Nyagatare'];
let COS=['Volcano Express','RITCO','Royal Express','Capital Express'];
let id=1;const mk=(co,f,t,h,pr,b)=>({id:id++,co,from:f,to:t,time:h,price:pr,base:b,ex:{}});
const ALL=[...Array(20)].map((_,i)=>i+1);
let trips=[mk('Volcano Express','Kigali','Huye','07:00',4000,[1,2,3,5,8]),mk('Volcano Express','Kigali','Huye','09:00',4000,ALL),mk('Volcano Express','Kigali','Huye','11:00',4000,[2,5,9,12,14]),mk('Volcano Express','Kigali','Huye','13:00',4000,[1,3]),mk('Volcano Express','Kigali','Huye','15:00',4000,[]),
mk('RITCO','Kigali','Huye','08:00',3500,[4,8,11]),mk('RITCO','Kigali','Huye','09:30',3500,ALL),mk('RITCO','Kigali','Huye','12:00',3500,[1,2,6,7]),
mk('Royal Express','Kigali','Huye','10:00',4500,[6,7]),mk('Royal Express','Kigali','Huye','14:00',4500,[3]),mk('Capital Express','Kigali','Huye','10:30',4000,[1,2,3,10,11,15,16]),mk('RITCO','Kigali','Musanze','08:00',3000,[5]),mk('Volcano Express','Kigali','Rubavu','07:30',4500,[2,3])];
let vehicles=[{co:'Volcano Express',plate:'RAH 123 A',type:'Coaster',seats:20},{co:'RITCO',plate:'RAE 450 B',type:'Bus',seats:20}];
let bookings=[];
const ST={Kigali:['Gare ya Nyabugogo','Kimironko (ku cyapa)','Remera – Giporoso (ku cyapa)','Kicukiro Centre (ku cyapa)'],Huye:['Gare ya Huye','Ngoma – Sovu (ku cyapa)','Tumba (ku cyapa)'],Musanze:['Gare ya Musanze','Muhoza (ku cyapa)'],Rubavu:['Gare ya Rubavu','Gisenyi – Umuganda (ku cyapa)'],Rusizi:['Gare ya Rusizi','Kamembe (ku cyapa)'],Muhanga:['Gare ya Muhanga','Ruyenzi (ku cyapa)'],Nyagatare:['Gare ya Nyagatare','Matimba (ku cyapa)']};
const MID={'Kigali-Huye':['Kamonyi – Gihara (ku cyapa)','Muhanga (ku cyapa)','Nyanza (ku cyapa)'],'Kigali-Musanze':['Shyorongi (ku cyapa)','Gakenke (ku cyapa)'],'Kigali-Rubavu':['Shyorongi (ku cyapa)','Ngororero (ku cyapa)']};
const stopsFor=(f,t)=>[...ST[f],...(MID[f+'-'+t]||[])];
let DRIVERS=[{co:'Volcano Express',name:'Umushoferi',ph:'0780000004',lic:'DL-0001'},{co:'Volcano Express',name:'Jean Bosco',ph:'0788000001',lic:'DL-0002'},{co:'RITCO',name:'Eric Mugisha',ph:'0788000002',lic:'DL-0003'},{co:'Royal Express',name:'Patrick Habimana',ph:'0788000003',lic:'DL-0004'},{co:'Capital Express',name:'Alice Uwase',ph:'0788000004',lic:'DL-0005'}];
vehicles.push({co:'Royal Express',plate:'RAD 789 C',type:'Bus',seats:20},{co:'Capital Express',plate:'RAF 321 D',type:'Coaster',seats:20});
trips.forEach((t,i)=>{const v=vehicles.filter(x=>x.co===t.co),d=DRIVERS.filter(x=>x.co===t.co);t.veh=v.length?v[i%v.length].plate:'—';t.drv=d.length?d[i%d.length].name:'—'});
const PW='Blessing12345@';
Object.keys(U).forEach(k=>delete U[k]);
const addU=(ph,r,n,co,em)=>{U[ph]={p:PW,r,n,ph,co,em}};
addU('0788000000','admin','National Admin',undefined,'Dnpjirexcompany@gmail.com');
addU('0780000001','passenger','Umugenzi Demo');
COS.forEach((c,i)=>{addU('078100000'+(i+1),'company',c+' Admin',c);addU('078200000'+(i+1),'agent','Agent '+c.split(' ')[0],c)});
DRIVERS.forEach((d,i)=>{d.ph='078300000'+(i+1);addU(d.ph,'driver',d.name,d.co)});
function fill(){$('#lu').value='Dnpjirexcompany@gmail.com';$('#lp').value='Blessing12345@'}
function canPay(){return S.seat&&S.pk&&(S.pk!=='Ahandi ku muhanda'||S.pkn.trim())}
function pkIn(el){S.pkn=el.value;const b=$('#pb');if(b)b.disabled=!canPay()}
function coAgt(u){const ag=Object.values(U).filter(a=>a.r==='agent'&&a.co===u.co);return `<div class="card"><h2>Fungura konti y’umukozi ugurisha amatike</h2><div class="g"><div><label>IZINA RY’UMUKOZI</label><input id="an"></div><div><label>TELEFONE</label><input id="ap" inputmode="tel"></div></div><button class="btn f" onclick="addA()">Fungura konti</button><div class="mu" style="margin-top:8px">Umukozi akorera ${u.co} gusa. Yinjira akoresheje telefone n’ijambo ry’ibanga rye.</div></div><div class="card"><h2>Abakozi ba ${u.co}</h2>${tbl(['Izina','Telefone','Amatike yagurishije'],ag.map(a=>[a.n,a.ph,bookings.filter(b=>b.by===a.ph).length]))}</div>`}
function addA(){const n=v('an').trim(),ph=v('ap').trim();if(!n||ph.length<9||U[ph])return alert('Andika izina na telefone itarakoreshwa.');addU(ph,'agent',n,S.user.co);render()}
function pickCard(t){const L=stopsFor(S.from,S.to).concat(['Ahandi ku muhanda']);return `<div class="card"><h2>Aho ufatira imodoka</h2><div class="mu" style="margin-bottom:8px">Si ngombwa kujya muri gare. Hitamo icyapa kiri hafi yawe ku muhanda imodoka inyuramo, cyangwa uhitemo «Ahandi ku muhanda» wandike agace utuyemo (umurenge, akagari, umudugudu), imodoka igusange mu cyerekezo cyawe.</div><div class="pk">${L.map(s=>`<div class="pp ${S.pk===s?'on':''}" onclick="S.pk='${s}';render()">${s.includes('Gare')?'🏢':s==='Ahandi ku muhanda'?'📍':'🚏'} ${s}<small>${s.includes('Gare')?'Gare':s==='Ahandi ku muhanda'?'Andika agace utuyemo':'Icyapa ku muhanda'}</small></div>`).join('')}</div>${S.pk?`<label>${S.pk==='Ahandi ku muhanda'?'ANDIKA AGACE UTUYEMO (umurenge, akagari, umudugudu, ikimenyetso)':'IBINDI BIFASHA UMUSHOFERI (si ngombwa)'}</label><input value="${S.pkn}" oninput="pkIn(this)" placeholder="Urugero: hafi ya sitasiyo ya lisansi">`:''}</div>`}

const SOCOFF={},COSINFO={'Volcano Express':{tin:'TIN-100200300',rura:'RURA/P/001',addr:'Kigali',phone:'0781000001',docs:{}}};
let AT={};const MAXF=1500000;
const kb=n=>Math.max(1,Math.round(n/1024))+' KB';
const ico=r=>STAFF[r]?STAFF[r][1]:r==='passenger'?'🧳':r==='admin'?'🛡️':'🏢';
const up=u=>u.r==='company'?Object.values(U).find(a=>a.r==='admin'):u.r==='admin'?null:bossOf(u);

function isAbove(m,t){let x=t;for(let i=0;i<6&&x;i++){const b=STAFF[x]&&STAFF[x][2];if(!b)return false;if(b===m)return true;x=b}return false}
const canPeek=(me,t)=>t.ph!==me.ph&&(me.r==='admin'||(me.co&&t.co===me.co&&(me.r==='company'?t.r!=='company':isAbove(me.r,t.r))));
/* attachments (photos + PDF) */
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);res({n:f.name,t:'image/jpeg',s:Math.round(d.length*.75),d})};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
function rawRead(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res({n:f.name,t:f.type,s:f.size,d:r.result});r.onerror=()=>res(null);r.readAsDataURL(f)})}
const attList=k=>(AT[k]||[]).map((f,i)=>`<span class="chip" style="display:inline-block;margin:4px 4px 0 0">${f.t.startsWith('image/')?'🖼️':'📄'} ${esc(f.n)} · ${kb(f.s)} <a style="color:var(--red);cursor:pointer" onclick="delAtt('${k}',${i})">✕</a></span>`).join('');
async function pickFiles(el,k,multi){const out=multi?(AT[k]||[]):[];for(const f of [...el.files].slice(0,5)){if(f.type.startsWith('image/')){const x=await shrink(f);if(x)out.push(x)}else if(f.type==='application/pdf'){if(f.size>MAXF){alert('PDF ikwiye kuba iri munsi ya 1.5 MB.');continue}const x=await rawRead(f);if(x)out.push(x)}else alert('Hitamo ifoto cyangwa PDF gusa.')}AT[k]=out;el.value='';const b=$('#al_'+k);if(b)b.innerHTML=attList(k)}
function delAtt(k,i){AT[k].splice(i,1);const b=$('#al_'+k);if(b)b.innerHTML=attList(k)}
const upl=(k,l,multi,req)=>`<div style="margin-top:10px"><label>${l}${req?' *':''}</label><input type="file" accept="image/*,application/pdf" ${multi?'multiple':''} onchange="pickFiles(this,'${k}',${!!multi})"><div id="al_${k}">${attList(k)}</div></div>`;
const attHtml=L=>(L||[]).map(f=>f.t.startsWith('image/')?`<div style="display:inline-block;margin:4px;vertical-align:top"><img src="${f.d}" alt="" style="max-height:110px;max-width:160px;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in" onclick="const z=this.style.maxHeight==='none';this.style.maxHeight=z?'110px':'none';this.style.maxWidth=z?'160px':'100%'"><div class="mu">${esc(f.n)}</div></div>`:`<a class="chip" style="display:inline-block;margin:4px;text-decoration:none" href="${f.d}" target="_blank" rel="noopener">📄 ${esc(f.n)} · ${kb(f.s)}</a>`).join('');

const MONTHS=['Mutarama','Gashyantare','Werurwe','Mata','Gicurasi','Kamena','Nyakanga','Kanama','Nzeri','Ukwakira','Ugushyingo','Ukuboza'],ml=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4),MLIST=['2026-08','2026-09','2026-10','2026-11','2026-12'];

const net=r=>r.base+(r.bonus||0)-(r.ded||0),stT={Pending:'⏳ Ategereje kwemezwa',Approved:'✅ Yemejwe · ategereje kwishyurwa',Paid:'💚 Yishyuwe'};
(function(){let k=0;Object.values(U).filter(a=>a.co&&STAFF[a.r]).forEach(a=>{k++;SAL[a.ph]=(SALR[a.r]||150000)+(COS.indexOf(a.co)%5)*5000;
 ['2026-08','2026-09','2026-10','2026-11'].forEach(m=>{let st='Paid',bonus=0,ded=0,note='';
  if(m==='2026-08'&&k%9===0){ded=5000;note='Igikurwaho: ikosa ry’akazi'}
  if(m==='2026-09'&&k%4===1){bonus=30000;note='Bonus: imikorere myiza'}
  if(m==='2026-10'){if(k%5===0)st='Approved';if(k%7===0){bonus=20000;note='Bonus: amasaha y’inyongera'}}
  if(m==='2026-11')st=k%6===0?'Approved':'Pending';
  PAYS.push({id:pid++,ph:a.ph,co:a.co,m,base:SAL[a.ph],bonus,ded,note,st,paidAt:st==='Paid'?m+'-28':''})})})})();
function payView(u){const L=PAYS.filter(x=>x.ph===u.ph).sort((a,b)=>b.m.localeCompare(a.m)),paid=L.filter(x=>x.st==='Paid'),open=L.filter(x=>x.st!=='Paid'),adj=L.filter(x=>x.bonus||x.ded);
 return (SAL[u.ph]?'':'<div class="alert">Umushahara wawe ntaragashyirwaho n’ushinzwe guhemba.</div>')+stats([[fm2(SAL[u.ph]),'Umushahara fatizo ku kwezi'],[paid.length,'Amezi yishyuwe'],[open.length,'Amezi atarishyurwa'],[fm2(paid.reduce((s,r)=>s+net(r),0)),'Yose yishyuwe']])
 +(open.length?'<div class="alert"><b>Atarishyurwa:</b> '+open.map(r=>ml(r.m)+' — '+stT[r.st]).join(' · ')+'</div>':'')
 +'<div class="card"><div class="hd"><h2 style="margin:0">Amateka y’imishahara</h2><button class="btn o noprint" style="margin-left:auto;padding:6px 12px" onclick="window.print()">🖨️ Sohora</button></div>'+tbl(['Ukwezi','Umushahara','Bonus','Ibikurwaho','Wishyuwe (net)','Imiterere','Yishyuwe kuwa'],L.map(r=>[ml(r.m),fm2(r.base),r.bonus?'+'+fm2(r.bonus):'—',r.ded?'−'+fm2(r.ded):'—','<b>'+fm2(net(r))+'</b>',stT[r.st],r.paidAt||'—']))+'</div>'
 +'<div class="card"><h2>🎁 Bonus n’ibindi ugenerwa</h2>'+tbl(['Ukwezi','Amafaranga','Ibisobanuro','Imiterere'],adj.map(r=>[ml(r.m),(r.bonus?'+'+fm2(r.bonus):'')+(r.ded?' −'+fm2(r.ded):''),r.note||'—',stT[r.st]]))+'</div>'}
function recRows(R,act){return R.map(r=>{const a=U[r.ph]||{n:r.ph,r:'driver'};return [a.n,RN[a.r]||a.r,fm2(r.base),r.bonus?'+'+fm2(r.bonus):'—',r.ded?'−'+fm2(r.ded):'—','<b>'+fm2(net(r))+'</b>',stT[r.st],act(r)]})}
function payrollView(u){const E=emps(u.co),m=S.pm||'2026-11',R=PAYS.filter(x=>x.co===u.co&&x.m===m),ap=R.filter(r=>r.st==='Approved').length,sel=(id,L,f)=>'<select id="'+id+'">'+L.map(x=>'<option value="'+f(x)[0]+'">'+f(x)[1]+'</option>').join('')+'</select>';
 return '<div class="card"><h2>Shyiraho umushahara w’umukozi</h2>'+tbl(['Umukozi','Inshingano','Umushahara (RWF)',''],E.map(a=>[a.n,RN[a.r],'<input id="sal_'+a.ph+'" type="number" value="'+(SAL[a.ph]||'')+'" style="max-width:130px;padding:8px">','<button class="btn o" style="padding:6px 10px" onclick="setSal(\''+a.ph+'\')">Bika</button>']))+'</div>'
 +'<div class="card"><h2>Bonus cyangwa igikurwaho</h2><div class="g"><div><label>UMUKOZI</label>'+sel('ap_e',E,a=>[a.ph,a.n+' · '+RN[a.r]])+'</div><div><label>UKWEZI</label>'+sel('ap_m',MLIST,x=>[x,ml(x)])+'</div><div><label>UBWOKO</label><select id="ap_t"><option value="b">🎁 Bonus</option><option value="d">➖ Igikurwaho</option></select></div><div><label>AMAFARANGA (RWF)</label><input id="ap_a" type="number"></div><div><label>IMPAMVU</label><input id="ap_r"></div></div><button class="btn f" onclick="addAdj()">Ongeraho</button></div>'
 +'<div class="card"><h2>Imishahara y’ukwezi</h2><div class="g"><div><label>UKWEZI</label><select onchange="S.pm=this.value;render()">'+MLIST.map(x=>'<option value="'+x+'" '+(x===m?'selected':'')+'>'+ml(x)+'</option>').join('')+'</select></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="prepPay()">Tegura imishahara y’ukwezi</button>'+(ap?'<button class="btn o" onclick="payAll()">Ishyura zose zemejwe ('+ap+')</button>':'')+'</div><div class="mu" style="margin:8px 0">Itegurwa → Admin wa sosiyete arayemeza → hanyuma wowe urishyura, umukozi akabibona kuri konti ye.</div>'+tbl(['Umukozi','Inshingano','Umushahara','Bonus','Ibikurwaho','Net','Imiterere',''],recRows(R,r=>r.st==='Approved'?'<button class="btn o" style="padding:5px 9px" onclick="payRec('+r.id+')">Ishyura</button>':r.st==='Paid'?r.paidAt:'—'))+'</div>'}

 return '<div class="card"><div class="hd"><h2 style="margin:0">Imishahara yo kwemeza ('+R.length+')</h2>'+(R.length?'<button class="btn" style="margin-left:auto;padding:7px 12px" onclick="apprAll()">Emeza zose</button>':'')+'</div>'+tbl(['Umukozi','Inshingano','Umushahara','Bonus','Ibikurwaho','Net','Ukwezi',''],R.map(r=>{const a=U[r.ph]||{n:r.ph,r:'driver'};return [a.n,RN[a.r]||a.r,fm2(r.base),r.bonus?'+'+fm2(r.bonus):'—',r.ded?'−'+fm2(r.ded):'—','<b>'+fm2(net(r))+'</b>',ml(r.m),'<button class="btn o" style="padding:5px 9px" onclick="apprRec('+r.id+')">Emeza</button>']}))+'</div>'}
function setSal(ph){if(S.user.r!=='fin')return;const x=+v('sal_'+ph);if(!(x>0))return alert('Andika umushahara nyawo.');SAL[ph]=x;PAYS.filter(r=>r.ph===ph&&r.st==='Pending').forEach(r=>r.base=x);note(ph,'Umushahara wawe washyizweho: '+fm2(x));logA(S.user.n,'Yashyizeho umushahara wa '+U[ph].n+': '+fm2(x),S.user.co);render()}
function addAdj(){if(S.user.r!=='fin')return;const ph=v('ap_e'),m=v('ap_m'),ty=v('ap_t'),amt=+v('ap_a'),why=esc(v('ap_r').trim());if(!ph||!(amt>0)||!why)return alert('Hitamo umukozi, andika amafaranga n’impamvu.');if(!SAL[ph])return alert('Banza ushyireho umushahara w’uyu mukozi.');

 if(ty==='b')r.bonus=(r.bonus||0)+amt;else r.ded=(r.ded||0)+amt;r.note=(r.note?r.note+'; ':'')+(ty==='b'?'Bonus: ':'Igikurwaho: ')+why;r.st='Pending';note(ph,(ty==='b'?'Bonus nshya ':'Igikurwaho ')+fm2(amt)+' ('+why+') — '+ml(m));logA(S.user.n,(ty==='b'?'Yongeyeho bonus ':'Yongeyeho igikurwaho ')+fm2(amt)+' ku '+U[ph].n,S.user.co);render()}
function prepPay(){if(S.user.r!=='fin')return;const m=S.pm||'2026-11',co=S.user.co;let n=0;emps(co).filter(a=>SAL[a.ph]&&!PAYS.some(r=>r.ph===a.ph&&r.m===m)).forEach(a=>{PAYS.push({id:pid++,ph:a.ph,co,m,base:SAL[a.ph],bonus:0,ded:0,note:'',st:'Pending',paidAt:''});note(a.ph,'Umushahara wa '+ml(m)+' wateguwe, utegereje kwemezwa.');n++});
 const ad=Object.values(U).find(a=>a.co===co&&a.r==='company');if(ad&&n)note(ad.ph,'Imishahara ya '+ml(m)+' ('+n+') itegereje kwemezwa.');logA(S.user.n,'Yateguye imishahara ya '+ml(m)+' ('+n+')',co);render()}
