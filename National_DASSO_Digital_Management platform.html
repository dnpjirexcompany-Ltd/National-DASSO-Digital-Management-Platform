<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4d2a">
<title>National DASSO Digital Management Platform — Model Platform</title>
<style>
:root{--navy:#0f4d2a;--navy2:#166534;--gold:#4ade80;--bg:#f1f7f3;--paper:#fff;--ink:#10261a;--muted:#5f7d6a;--line:#dcebe1;--blue:#15803d;--green:#15803d;--orange:#3f8f5a;--red:#14532d;--soft:#e7f4ec;--shadow:0 8px 26px rgba(15,77,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:255px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),#0a3320);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:9px;align-items:center;padding:2px 7px 18px;border-bottom:1px solid #ffffff22;min-width:0}.brand>div:last-child{min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:17px}
.brand strong{display:block;font-size:12px;line-height:1.25;white-space:normal}.brand small{color:#bfe3cb;font-size:10px;letter-spacing:.12em}
.navlabel{color:#8fc2a0;font-size:10px;font-weight:800;letter-spacing:.13em;padding:0 10px;margin:0 0 -10px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d9f0e1;text-align:left;padding:10px 11px;border-radius:9px;display:flex;gap:11px;align-items:center;font-weight:600}
.nav button:hover,.nav button.active{background:#ffffff16;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}
.ico{width:20px;text-align:center;font-size:16px}
.sidefoot{margin-top:auto;color:#9cc9ac;font-size:11px;line-height:1.6;padding:12px 8px;border-top:1px solid #ffffff22}
.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px;position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}.rolepick{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);max-width:300px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e4f3ea;color:var(--navy);font-weight:800}
.content{max-width:1450px;margin:auto;padding:28px 30px 50px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:25px;line-height:1.2;margin:5px 0;color:var(--navy)}.subtitle{color:var(--muted);margin:0;max-width:760px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;font-weight:700}.btn:hover{filter:brightness(1.12)}.btn.gold{background:var(--gold);color:#0f2e1c}.btn.light{background:#ecf6ef;color:var(--navy);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.sm{padding:6px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}
.metric{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.metric .label{font-size:12px;color:var(--muted);font-weight:650}.metric strong{display:block;font-size:27px;color:var(--navy);margin-top:6px}.metric .bubble{background:var(--soft);border-radius:10px;padding:9px;font-size:18px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);gap:16px}
.card h2{font-size:15px;margin:0 0 13px;color:var(--navy)}.card h3{font-size:13px;margin:16px 0 8px;color:var(--navy)}
.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:30px;background:#ecf6ef;color:#2f5a40;font-size:11px;font-weight:750;white-space:nowrap}.tag.green{background:#e7f5ef;color:#13734e}.tag.orange{background:#ecfdf3;color:#2f6f45}.tag.red{background:#e2f3e8;color:#14532d}.tag.blue{background:#e3f6e9;color:#166534}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}td{font-size:12px}tr:last-child td{border-bottom:0}
.progress{height:8px;background:#e6f1ea;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#166534,#4ade80);border-radius:10px}
.steps{display:grid;gap:10px}.step{display:flex;gap:11px;align-items:flex-start}.num{width:27px;height:27px;border-radius:9px;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}.step b{display:block;font-size:12px}.step p{margin:2px 0 0;color:var(--muted);font-size:11px}
.notice{padding:12px 14px;background:#ecfdf3;border:1px solid #bbf7d0;border-radius:10px;color:#14532d;font-size:12px;margin-bottom:16px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#2f5a40}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d6e9dc;border-radius:8px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #d5f1de;border-color:#6fcf8f}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hr{height:1px;background:var(--line);margin:14px 0}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.flow span{padding:8px 10px;background:#eef7f1;border-radius:8px;font-size:11px;font-weight:750}.flow i{color:#8fb09b;font-style:normal}
.timeline{border-left:2px solid #d6e9dc;margin:8px 0 0 8px;padding-left:17px;display:grid;gap:13px}.timeline div{position:relative}.timeline div:before{content:"";position:absolute;left:-23px;top:4px;width:9px;height:9px;background:var(--gold);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #d6e9dc}.timeline b{font-size:12px}.timeline p{margin:2px 0;color:var(--muted);font-size:11px}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#0f4d2a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none}
.footer{color:#8fb09b;text-align:center;font-size:10px;margin-top:28px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:215px 1fr}.layout{grid-template-columns:1fr}}
@media(max-width:720px){.shell{display:block}.side{padding:12px;gap:10px}.brand{padding:0 4px 10px}.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.top{padding:0 15px;height:60px}.content{padding:20px 14px}.pagehead{display:block}.actions{margin-top:12px}.grid{gap:9px}.card{padding:13px}.metric strong{font-size:23px}.rolepick{max-width:210px}.formgrid{grid-template-columns:1fr}}
</style>
<style>
.hero{display:grid;grid-template-columns:1fr 360px;border-radius:16px;overflow:hidden;margin-bottom:20px;background:linear-gradient(120deg,#0a3320,#166534);box-shadow:var(--shadow);color:#fff}
.htxt{padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:9px;min-width:0}.htxt small{color:#86efac;font-weight:800;letter-spacing:.16em;font-size:10px}.htxt h2{margin:0;font-size:25px;line-height:1.2;color:#fff}.htxt p{margin:0;color:#d1fae5;font-size:13px;max-width:440px}
.hrole{align-self:flex-start;background:rgba(74,222,128,.18);color:#bbf7d0;border:1px solid rgba(134,239,172,.35);padding:4px 11px;border-radius:30px;font-size:12px;font-weight:700}
.himg{margin:0;position:relative;aspect-ratio:3/2;min-height:100%}.himg img{width:100%;height:100%;object-fit:cover;display:block}.himg:before{content:"";position:absolute;inset:0 auto 0 0;width:38%;background:linear-gradient(90deg,#166534,transparent);z-index:1}
.himg figcaption{position:absolute;right:0;bottom:0;left:0;z-index:2;padding:22px 14px 9px;font-size:10.5px;color:#fff;background:linear-gradient(0deg,rgba(10,51,32,.85),transparent);text-align:right}
.phs{grid-template-columns:1fr!important;max-width:380px}.phs img{height:auto!important;aspect-ratio:3/2;border-radius:14px!important}
@media(max-width:900px){.hero{grid-template-columns:1fr}.himg{order:-1;aspect-ratio:3/2;max-height:260px}.himg:before{display:none}.htxt{padding:20px}}
.rm{position:fixed;inset:0;z-index:900;background:rgba(10,51,32,.55);display:grid;place-items:center;padding:16px}.rmc{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}.uc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfefc}.uav{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#166534,#4ade80);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.uin{min-width:0;flex:1;display:grid}.uin b{font-size:13px}.uin span{font-size:11px;color:var(--muted)}.uin em{font-style:normal;font-size:10.5px;color:#8fb09b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swpop{position:fixed;top:66px;right:16px;width:370px;max-width:calc(100vw - 24px);max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(15,77,42,.25);z-index:60;padding:8px}.swh{display:grid;padding:8px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}.swh b{color:var(--navy)}
.swg{display:flex;align-items:center;gap:8px;padding:12px 8px 4px;font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.05em;text-transform:uppercase}.lvb{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px}.swg em{margin-left:auto;font-style:normal;background:#e7f4ec;border-radius:20px;padding:1px 8px}
.swi{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px;border-radius:10px;color:var(--ink)}.swi:hover,.swi.on{background:#ecf6ef}.swi.on{box-shadow:inset 3px 0 var(--gold)}
.authroot{display:flex;flex-direction:column;min-height:100%}.authroot .authwrap{flex:1;min-height:0}
.lvstrip{background:#082a1a;padding:14px 22px 12px;border-bottom:1px solid rgba(134,239,172,.25)}.lvtitle{color:#86efac;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px}
.lvrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.lvc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(134,239,172,.25);background:rgba(255,255,255,.05);color:#e7f9ee;text-align:left;cursor:pointer;transition:.15s}.lvc:hover{background:rgba(255,255,255,.1)}.lvc.on{background:#4ade80;color:#0a3320;border-color:#4ade80}.lvc b{display:block;font-size:12px;line-height:1.25}.lvc small{font-size:10.5px;opacity:.75}
.lvc .lvb{flex:none;width:32px;height:32px;font-size:16px;border-radius:10px;background:rgba(255,255,255,.14)}.lvc.on .lvb{background:rgba(10,51,32,.15)}
.lvpanel{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:34px;align-items:center}.lvpanel .muted{color:#9cc9ac}.lvp{display:flex;align-items:center;gap:9px;background:#fff;border:0;border-radius:10px;padding:5px 12px 5px 5px;cursor:pointer;text-align:left}.lvp:hover{background:#ecfdf3}.lvp b{display:block;font-size:12px;color:#0f4d2a}.lvp small{font-size:10.5px;color:#5f7d6a}.lvp .uav{width:28px;height:28px;border-radius:9px;font-size:12px}
@media(max-width:1100px){.lvrow{display:flex;overflow-x:auto;padding-bottom:4px}.lvc{flex:none;min-width:190px}}
.lvbar{display:flex;gap:8px;overflow-x:auto;margin:0 0 18px;padding:2px 2px 6px}.lvbar button{flex:1;min-width:170px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);text-align:left;color:var(--ink)}.lvbar button:hover{border-color:#6fcf8f}.lvbar button.on{border-color:#4ade80;box-shadow:inset 0 -3px #4ade80}.lvbar b{display:block;font-size:12px}.lvbar small{color:var(--muted);font-size:10.5px}.lvbar .lvb{flex:none;width:32px;height:32px;border-radius:10px;font-size:16px}

/* ===== Umurongo w'ibyiciro hejuru ya platform ===== */
.catwrap{position:sticky;top:70px;z-index:4;background:linear-gradient(180deg,#0a3320,#0f4d2a);border-bottom:1px solid rgba(134,239,172,.25);box-shadow:0 6px 18px rgba(10,51,32,.18)}
.catin{padding:10px 30px}
.catrow{position:relative;display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin;scrollbar-color:#2f7a4d transparent}
.cat{flex:1 0 172px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1px solid rgba(134,239,172,.22);background:rgba(255,255,255,.06);color:#e7f9ee;text-align:left;font:inherit;min-width:0;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}
.cat.click{cursor:pointer}
.cat.click:hover{background:rgba(255,255,255,.13);border-color:#86efac;transform:translateY(-1px)}
.cat.click:focus-visible{outline:2px solid #bbf7d0;outline-offset:2px}
.catic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--c);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cattx{min-width:0;display:grid;gap:2px;flex:1}
.cattx b{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cattx small{font-size:10.5px;color:#9cc9ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catgo{flex:none;font-style:normal;font-size:11px;opacity:.6}
.cat.on{background:linear-gradient(135deg,#4ade80,#22c55e);border-color:#bbf7d0;color:#052e16;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.cat.on small{color:#0a3320;font-weight:700}
.cat.on .catic{background:rgba(255,255,255,.7);box-shadow:none}
.swpop{top:140px}
@media(max-width:720px){.catwrap{position:static}.catin{padding:8px 12px}.cat{flex:0 0 200px}}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#4ade80;color:#0f4d2a;display:grid;place-items:center;flex:none;font-weight:900;font-size:18px}
.brand .logo{width:42px;height:50px;border-radius:0;background:none;color:inherit;overflow:visible}.brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
</style>

const hl=(a,t)=>a&&a.length?`<div class="card"><h2>${t}</h2><ul style="margin:0;padding-left:18px;display:grid;gap:7px;font-size:13px">${a.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"";
const hg=(a,t)=>a&&a.length?`<div class="card"><h2>${t}</h2><div class="inline">${a.map(x=>`<span class="tag blue">${x}</span>`).join("")}</div></div>`:"";
function dutiesPage(){const r=state.role,d=DUTIES[r],nm=rname(r);if(!d)return heading("INSHINGANO","Inshingano","Nta makuru ahari.");
const pages=menu.filter(allowed).map(m=>m.label),sub=(hier[r]||[]).map(rname);
return heading("INSHINGANO Z’UYU MWANYA",nm,d.p,"")+(d.n?`<div class="notice">${d.n}</div>`:"")+
`<div class="layout"><div style="display:grid;gap:16px;align-content:start">${hl(d.d,"Inshingano nyamukuru")}${hl(d.l,"Imbibi n’ibyo yirinda")}</div><div style="display:grid;gap:16px;align-content:start">${hl(d.c,"Imikoranire n’izindi nzego")}${hg(d.r,"Raporo atanga")}${hg(d.k,"Ibipimo byo gusuzuma imikorere (KPIs)")}<div class="card"><h2>Ibyo konti yawe yemerewe kuri platform</h2><div class="inline">${pages.map(x=>`<span class="tag green">${x}</span>`).join("")}</div>${sub.length?`<h3>Dashboard z’abo ushinzwe (gusoma gusa)</h3><div class="inline">${sub.map(x=>`<span class="tag">${x}</span>`).join("")}</div>`:""}</div></div></div>`}
function heroBlock(){const a=state.acct;if(!a||!IMG.photos.length)return"";const has=!!DUTIES[state.actor];return`<section class="hero"><div class="htxt"><small>MURAKAZA NEZA</small><h2>${esc(rname(state.actor))}</h2><p>Iyi dashboard igaragaza inshingano n’ibikorwa by’umwanya wawe gusa.</p>${has?`<div><button class="btn gold sm" onclick="go('duties')">Inshingano zanjye</button></div>`:""}</div><figure class="himg"><img src="${IMG.photos[0]}" alt="Umuyobozi yamukanya n’umukozi wa DASSO mu muhango"><figcaption>Ubufatanye bw’ubuyobozi na DASSO</figcaption></figure></section>`}
function sysDash(){const pend=ACC.filter(a=>a.status==="Itegereje kwemezwa"||a.resetReq);return heading("SYSTEM ADMINISTRATION","Dashboard y’Admin wa Sisitemu","Gucunga konti z’abakoresha bose: gufungura, kwemeza, guhagarika no gusubiza amagambo y’ibanga.",'<button class="btn gold" onclick="go(\'accounts\')">Gucunga konti</button>')+
`<div class="grid">${stat("Konti zose",ACC.length,"👥","Abakoresha bose")}${stat("Zitegereje kwemezwa",ACC.filter(a=>a.status==="Itegereje kwemezwa").length,"◷","Zisaba icyemezo")}${stat("Zahagaritswe",ACC.filter(a=>a.status==="Yahagaritswe").length,"⛔","Ntizinjira")}${stat("Zisaba ijambo ry’ibanga",ACC.filter(a=>a.resetReq).length,"🔑","Zasabye guhindurirwa")}</div>
<div class="card"><h2>Konti zisaba igikorwa</h2>${table(["Amazina","Uruhare","Imiterere"],pend.map(a=>[esc(a.name),rname(a.role),tag(a.status)+(a.resetReq?' <span class="tag orange">Asaba ijambo ry’ibanga</span>':"")]))}</div>
${demoPanel()}<div class="notice"><b>Icyitonderwa cy’umutekano:</b> Iyi demo ibika konti muri browser (amagambo y’ibanga abikwa ahinduwe hash); ni iy’igerageza gusa. Kugira ngo login zibe iz’umutekano koko hakenewe <b>backend na database</b> (kwemeza ijambo ry’ibanga kuri seriveri, session zirinzwe, konti n’amateka bibikwa muri database). Login igaragara gusa muri HTML ntiba ihagije.</div>`}
{const f=dashboard;dashboard=function(){return heroBlock()+(state.role==="sysadmin"?sysDash():f())}}

const PERM={akagari:["Ku Kagari"],umurenge:["Ku Murenge"],coord:["Ku Karere","Ku Muyobozi wa DASSO"],mayor:["Ku Muyobozi w’Akarere"],province:["Ku Ntara"],provcoord:["Ku Ntara"],minaloc:["Kuri MINALOC"]};
const NEXT_ST={"Ku Kagari":"Ku Murenge","Ku Murenge":"Ku Karere","Ku Karere":"Ku Muyobozi w’Akarere","Ku Muyobozi wa DASSO":"Ku Muyobozi w’Akarere","Ku Muyobozi w’Akarere":"Ku Ntara","Ku Ntara":"Kuri MINALOC","Kuri MINALOC":"Yemejwe"};
const NEXT_LBL={"Ku Kagari":"Umurenge","Ku Murenge":"Umuyobozi wa DASSO ku Karere","Ku Karere":"Umuyobozi w’Akarere","Ku Muyobozi wa DASSO":"Umuyobozi w’Akarere","Ku Muyobozi w’Akarere":"Intara","Ku Ntara":"MINALOC","Kuri MINALOC":"MINALOC (kwemeza burundu)"};
function closeRM(){const m=$("rmodal");if(m)m.remove()}
function rmAct(id,op){const r=state.reports.find(x=>x.id===id);if(!r||!(PERM[state.role]||[]).includes(r.status)||state.actor!==state.role){closeRM();return}
const n=(($("rmnote")||{}).value||"").trim(),who=(state.acct?state.acct.name+", ":"")+rname(state.role);
if(op==="fwd"){const to=NEXT_ST[r.status]||"Yemejwe",lb=NEXT_LBL[r.status];r.status=to;r.trail.push("Yoherejwe → "+lb+" ("+who+")"+(n?" — "+n:""));log("Raporo "+r.code+" yoherejwe ku "+lb);toast("Raporo yoherejwe → "+lb)}

const witRow=()=>`<div class="cp-wit"><input class="wn" maxlength="80" placeholder="Amazina y’uwabibonye"><input class="wp" inputmode="tel" maxlength="14" placeholder="Telefoni: 07..."></div>`;

window.cpDelWit=function(id,min){const b=$(id);if(b.children.length>min)b.lastElementChild.remove();else toast("Ntushobora kubura munsi ya "+min+".")};
function readWits(id,min){
 const out=[],seen=new Set();
 for(const r of $(id).querySelectorAll(".cp-wit")){
  const n=r.querySelector(".wn").value.trim(),p=normP(r.querySelector(".wp").value);
  if(!n&&!p)continue;
  if(!n||n.length<3||!/\p{L}/u.test(n))return"Andika amazina y’umutanzabuhamya (nibura inyuguti 3).";
  if(!phOK(p))return"Telefoni ya "+n+" ntiyemewe (urugero 0788123456).";
  if(seen.has(p))return"Telefoni ya "+n+" isanzwe yanditswe ku wundi mutanzabuhamya.";
  seen.add(p);out.push({name:n,phone:p})}
 if(out.length<min)return"Hakenewe abatanga buhamya "+min+" nibura, buri wese afite amazina na telefoni.";
 return out}
const witBlock=(id,min,title)=>`<div class="field full"><label>${title}</label><div class="cp-wits" id="${id}">${witRow().repeat(Math.max(min,1))}</div><div class="inline"><button type="button" class="btn light sm" onclick="cpAddWit('${id}')">+ Ongeraho</button><button type="button" class="btn light sm" onclick="cpDelWit('${id}',${Math.max(min,1)})">− Kuraho uwa nyuma</button></div></div>`;

function page(){
 const T=TABS();if(!T.some(t=>t[0]===state.hvTab))state.hvTab=T[0][0];const t=state.hvTab,L=list();
 let body="";
 if(t==="dash")body=dash();
 else if(t==="Daily Shift"||t==="Transfer"){const rec=state.hvEdit&&state.handovers.find(x=>x.id===state.hvEdit);body=form(rec?rec.type:t)+`<div class="card"><h2>Ihererekanya ryanjye (${t==="Transfer"?"Transfer":"Daily Shift"})</h2>${rows(L.filter(r=>mineOut(r)&&r.type===t),true)}</div>`}
 else if(t==="out")body=`<div class="card"><h2>Outgoing Officer Report — ibyo natanze</h2>${rows(L.filter(mineOut),true)}</div>`;
 else if(t==="in")body=`<div class="card"><h2>Incoming Officer Acceptance — ibyo nasimbuye</h2><div class="notice">Kanda “Suzuma / Kora” ubanze usome raporo, ugenzure ibikoresho n’ibikorwa, hanyuma uhitemo: Accept Handover, Accept with Remarks cyangwa Reject / Request Clarification.</div>${rows(L.filter(mineIn),true)}</div>`;
 else if(t==="rev")body=`<div class="card"><h2>Supervisor Verification</h2><div class="notice">Genzura niba amakuru yuzuye, hanyuma wohereze kuri DDC cyangwa usubize ku wayitanze.</div>${rows(L.filter(r=>r.status==="Received"),true)}</div>`;
 else if(t==="ddc")body=`<div class="card"><h2>DDC Approval Center</h2><div class="notice">DDC ni we ufite uburenganzira bwa nyuma: kwemeza, gusubiza ngo bikosorwe, cyangwa kwanga atanze impamvu.</div>${rows(L.filter(r=>r.status==="Under Review"),true)}</div>`;
 else if(t==="pend")body=`<div class="card"><h2>Pending Handover</h2>${rows(L.filter(r=>!/^(Completed|Approved|Rejected)$/.test(r.status)),true)}</div>`;
 else if(t==="hist"){const f=state.hvFilter,x=f?L.filter(r=>r.status===f):L;body=`<div class="card"><h2>Handover History</h2><div class="inline" style="margin-bottom:10px"><b class="small">Muyunguruzi:</b><select class="rolepick" onchange="state.hvFilter=this.value;render()"><option value="">Byose</option>${Object.keys(ST).map(s=>`<option ${f===s?"selected":""}>${s}</option>`).join("")}</select></div>${rows(x,false)}<p class="muted small">Amateka y’ihererekanya ntashobora gusibwa. Ibyemejwe ntibishobora guhindurwa.</p></div>`}
 else if(t==="rep"){const c=s=>L.filter(r=>r.status===s).length;body=`<div class="card"><h2>Handover Reports</h2><div class="hvstep">${[["Daily Handover",L.filter(r=>r.type!=="Transfer").length],["Transfer Report",L.filter(r=>r.type==="Transfer").length],["Asset (dispute)",L.filter(r=>r.dispute).length],["DDC: Approved / Rejected / Pending",c("Completed")+" / "+c("Rejected")+" / "+c("Under Review")]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div><div class="hr"></div><div class="inline"><button class="btn gold" onclick="hvCSV()">⬇ Excel (CSV)</button><button class="btn light" onclick="hvPrint()">🖨 PDF / Print</button></div></div><div class="card"><h2>Ibikubiyemo</h2>${rows(L,false)}</div>`}
 const tabs=`<div class="hvt">${T.map(x=>`<button class="${t===x[0]?"on":""}" onclick="hvTab('${x[0]}')">${x[1]}${x[0]==="in"&&isM()?(L.filter(r=>mineIn(r)&&r.status==="Submitted").length?" ("+L.filter(r=>mineIn(r)&&r.status==="Submitted").length+")":""):""}</button>`).join("")}</div>`;
 return heading("DASSO DIGITAL HANDOVER","Ihererekanya ry’inshingano (Handover & Takeover)","Umukozi urangije akazi atanga raporo, umusimbura arayemeza, umuyobozi agenzura, DDC akemeza. Sisitemu ibika amateka yose.")+tabs+body;
}

/* ---------- actions ---------- */
window.hvTab=t=>{state.hvTab=t;state.hvEdit=null;hvSel=[];hvClose();render()};
window.hvAdd=function(fl){for(const f of [...fl]){if(!OK.includes(ex(f.name))){toast("Ubwoko ntibwemewe: "+f.name);continue}if(f.size>MAXB){toast(f.name+" irenze 5 MB.");continue}if(hvSel.length>=MAXN){toast("Hemewe inyandiko "+MAXN+" gusa.");break}hvSel.push(f)}const b=$("hvFiles");if(b){const old=(state.hvEdit?(state.handovers.find(x=>x.id===state.hvEdit)||{files:[]}).files:[]);b.innerHTML=old.map(f=>`<span class="fi">📎 ${E(f.name)}</span>`).join("")+hvSel.map((f,i)=>`<span class="fi">🆕 ${E(f.name)} (${fs(f.size)}) <button type="button" onclick="hvRmF(${i})">×</button></span>`).join("")}};
window.hvRmF=i=>{hvSel.splice(i,1);hvAdd([])};
const g=id=>(($(id)||{}).value||"").trim();
window.hvSave=function(e,type,mode){
 if(e)e.preventDefault();if(guardWrite())return;if(!isM())return;
 const rec=state.hvEdit?state.handovers.find(x=>x.id===state.hvEdit):null;
 const d={};["name","staffId","prov","dist","sector","cell","post","at","inName","inStaff","inPos","inStart","reason","newPost","done","pending","issues","citizen","followup","advice"].forEach(k=>{if($("hv_"+k))d[k]=g("hv_"+k)});
 d.name=me();
 if(mode==="submit"){
  if(!d.inName||norm(d.inName)===norm(me())){toast("Hitamo umusimbura utari wowe.");return}
  if(norm(g("hv_sig"))!==norm(me())){toast("Digital Signature igomba guhura n’amazina yawe: "+me());return}
  if(!$("hv_confirm").checked){toast("Emeza ko amakuru ari ukuri.");return}
 }
 const assets=ASSETS.map((a,i)=>({item:i===4&&g("hva_4_n")?g("hva_4_n"):a,qty:Number(g("hva_"+i+"_q"))||0,cond:g("hva_"+i+"_c")||"Imeze neza",note:g("hva_"+i+"_t")}));
 const tasks=(d.pending||"").split("\n").map(x=>x.trim()).filter(Boolean).map(t=>({t,done:false}));
 const files=(rec?rec.files.slice():[]).concat(hvSel.map(f=>({name:f.name,size:f.size,url:URL.createObjectURL(f),by:me()})));
 const lost=assets.some(a=>a.cond==="Yabuze"||a.cond==="Yangiritse");
 let r=rec;
 if(!r){const n=state.handovers.length+1;r={id:n,code:"HND-2026-"+String(n).padStart(5,"0"),trail:[]};state.handovers.unshift(r)}
 Object.assign(r,{type,d,tasks,assets,files,outName:me(),inName:d.inName||"",dispute:r.dispute||lost,inConf:null,outConf:mode==="submit"?{sig:g("hv_sig"),time:NOW()}:null});
 r.status=mode==="submit"?"Submitted":"Draft";
 r.trail.push((mode==="submit"?"Yoherejwe na ":"Yabitswe nk’inyandiko (Draft) na ")+me()+" · "+NOW());
 log("Handover "+r.code+(mode==="submit"?" yoherejwe":" yabitswe (Draft)"));toast(mode==="submit"?r.code+" yoherejwe ku musimbura.":"Draft yabitswe.");
 state.hvEdit=null;hvSel=[];state.hvTab="out";render()};
window.hvEdit=id=>{const r=state.handovers.find(x=>x.id===id);if(!r||!mineOut(r)||!/^(Draft|Returned)$/.test(r.status))return;hvClose();state.hvEdit=id;state.hvTab=r.type;hvSel=[];render()};
window.hvEnd=()=>{const ok=state.handovers.some(r=>mineOut(r)&&/^(Submitted|Received|Under Review|Approved|Completed)$/.test(r.status)&&!state.hvDutyOK[r.id]);if(!ok){toast("Banza utange raporo y’ihererekanya (Submit) mbere yo kurangiza akazi.");return}toast("Wemerewe kurangiza akazi: raporo y’ihererekanya yatanzwe.")};
window.hvDone=(ref,i)=>{if(guardWrite())return;const a=state.hvActive[i];if(!a)return;a.done=true;log("Igikorwa cyakiriwe kirarangiye: "+a.t);toast("Igikorwa cyarangiye.");render()};
function stamp(r,txt){r.trail.push(txt+" · "+NOW())}
window.hvAccept=function(id){if(guardWrite())return;const r=state.handovers.find(x=>x.id===id);if(!r||!mineIn(r)||r.status!=="Submitted")return;
 if(mineOut(r)){toast("Ntushobora kwemeza ihererekanya ryawe wenyine.");return}
 const ch=document.querySelector('input[name="hvChoice"]:checked'),choice=ch?ch.value:"",rem=g("hvRem"),as=document.querySelector('input[name="hvAsset"]:checked');
 if(!choice){toast("Hitamo icyemezo.");return}
 if(!$("hvk_read").checked||!$("hvk_task").checked||!$("hvk_issue").checked||!as){toast("Banza ugenzure byose: raporo, ibikorwa, ibibazo n’ibikoresho.");return}
 if(choice!=="accept"&&!rem){toast("Andika ibisobanuro / ibyo utemeranyaho.");return}
 if(choice==="accept"&&as.value==="mismatch"){toast("Ibikoresho ntibihuye: hitamo “Accept with Remarks” cyangwa “Reject”.");return}
 if(norm(g("hvSig"))!==norm(me())){toast("Digital Confirmation igomba guhura n’amazina yawe: "+me());return}
 r.inConf={choice,remarks:rem,sig:g("hvSig"),time:NOW(),assets:as.value};
 if(as.value==="mismatch")r.dispute=true;
 if(choice==="reject"){r.status="Returned";stamp(r,"Yasubijwe na "+me()+" (Reject / Request Clarification): "+rem)}
 else{r.status="Received";stamp(r,"Yakiriwe na "+me()+(choice==="remarks"?" (Accept with Remarks): "+rem:" (Accept Handover)"))}
 log("Handover "+r.code+" "+(choice==="reject"?"yasubijwe":"yakiriwe")+" n’umusimbura");toast(choice==="reject"?"Yasubijwe ku wayitanze.":"Wemeje ko wakiriye.");hvClose();render()};
window.hvSup=function(id,ok){if(guardWrite())return;const r=state.handovers.find(x=>x.id===id);if(!r||!isS()||r.status!=="Received")return;const n=g("hvNote");
 if(!ok&&!n){toast("Andika impamvu yo gusubiza.");return}
 r.sup={by:RN(state.role),note:n,time:NOW()};r.status=ok?"Under Review":"Returned";stamp(r,ok?"Yagenzuwe na "+RN(state.role)+", yoherejwe kuri DDC"+(n?": "+n:""):"Yasubijwe na "+RN(state.role)+": "+n);
 log("Handover "+r.code+(ok?" yoherejwe kuri DDC":" yasubijwe"));toast(ok?"Yoherejwe kuri DDC.":"Yasubijwe.");hvClose();render()};
window.hvDdc=function(id,op){if(guardWrite())return;const r=state.handovers.find(x=>x.id===id);if(!r||!isD()||r.status!=="Under Review")return;const n=g("hvNote");
 if(op!=="approve"&&!n){toast("Andika impamvu.");return}
 if(op==="approve"&&r.dispute&&!n){toast("Hari Dispute ku bikoresho: andika uko yakemuwe mbere yo kwemeza.");return}
 r.ddc={by:"District DASSO Coordinator",decision:op,reason:n,time:NOW()};
 if(op==="approve"){r.status="Completed";r.dispute=false;stamp(r,"Yemejwe na DDC"+(n?": "+n:""));
  r.tasks.concat(String(r.d.followup||"").split("\n").filter(Boolean).map(t=>({t:"Gukurikirana: "+t}))).forEach(t=>state.hvActive.push({ref:r.code,t:t.t,from:r.outName,to:r.inName,since:NOW(),done:false}));
  stamp(r,"Sisitemu yimuriye inshingano n’ibikorwa bitararangira kuri "+r.inName)}
 else if(op==="return"){r.status="Returned";stamp(r,"Yasubijwe na DDC ngo bikosorwe: "+n)}
 else{r.status="Rejected";stamp(r,"Yanzwe na DDC: "+n)}
 log("DDC: "+r.code+" "+op);toast(op==="approve"?"Ihererekanya ryemejwe.":op==="return"?"Yasubijwe gukosorwa.":"Ryanzwe.");hvClose();render()};

/* ---------- detail modal ---------- */
let psel=0;
window.hvClose=()=>{const m=$("hvmodal");if(m)m.remove()};
window.hvPick=(id,i)=>{psel=i;hvOpen(id,true)};
window.hvOpen=function(id,keep){const r=state.handovers.find(x=>x.id===id);if(!r||!vis(r))return;if(!keep)psel=0;hvClose();
 const d=r.d,ro=state.actor!==state.role;
 const kv=(a,b)=>`<tr><th style="width:36%">${a}</th><td>${E(b)||"—"}</td></tr>`;
 const f=r.files[psel]||r.files[0],e=f?ex(f.name):"";
 const files=r.files.length?`<div class="tablewrap"><table style="min-width:360px"><tbody>${r.files.map((x,i)=>`<tr><td>📎 ${E(x.name)}</td><td>${fs(x.size)}</td><td style="white-space:nowrap"><button class="btn light sm" onclick="hvPick(${r.id},${i})">Reba</button> <a class="btn light sm" style="text-decoration:none;display:inline-block" href="${x.url}" download="${E(x.name)}">Kuramo</a></td></tr>`).join("")}</tbody></table></div>`+(f?(["png","jpg","jpeg","webp","gif"].includes(e)?`<img src="${f.url}" alt="" style="max-width:100%;max-height:50vh;border-radius:10px;border:1px solid var(--line);margin-top:8px">`:["pdf","txt"].includes(e)?`<iframe src="${f.url}" title="${E(f.name)}" style="width:100%;height:50vh;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff"></iframe>`:""):""):`<div class="empty">Nta nyandiko zometse.</div>`;
 let act="";
 if(!ro){
  if(mineOut(r)&&/^(Draft|Returned)$/.test(r.status))act=`<div class="hr"></div><button class="btn gold" onclick="hvEdit(${r.id})">Hindura / Ohereza</button>`;
  else if(mineIn(r)&&r.status==="Submitted")act=`<div class="hr"></div><h3>Incoming Officer Acceptance</h3><div class="hvbox"><div class="hvk"><label><input type="checkbox" id="hvk_read"> Nasomye raporo y’akazi</label><label><input type="checkbox" id="hvk_task"> Nafashe ibikorwa bitararangira</label><label><input type="checkbox" id="hvk_issue"> Nasobanukiwe ibibazo biriho</label></div>
   <h3>Ibikoresho</h3><label class="hvchk"><input type="radio" name="hvAsset" value="ok"> Nagenzuye ibikoresho, birahuye</label><label class="hvchk"><input type="radio" name="hvAsset" value="mismatch"> Ntibihuye (bizashyirwa muri Dispute)</label>
   <h3>Icyemezo</h3><label class="hvchk"><input type="radio" name="hvChoice" value="accept"> <b>Accept Handover</b></label><label class="hvchk"><input type="radio" name="hvChoice" value="remarks"> <b>Accept with Remarks</b></label><label class="hvchk"><input type="radio" name="hvChoice" value="reject"> <b>Reject / Request Clarification</b></label>
   <div class="field full"><label>Ibisobanuro / ibyo utemeranyaho (bikenewe kuri Remarks na Reject)</label><textarea id="hvRem" maxlength="1000"></textarea></div>
   <div class="field" style="max-width:380px;margin-top:8px"><label>Digital Confirmation — andika amazina yawe (${E(me())})</label><input id="hvSig" autocomplete="off"></div>
   <div style="margin-top:10px"><button class="btn gold" onclick="hvAccept(${r.id})">Emeza</button></div></div>`;
  else if(isS()&&r.status==="Received")act=`<div class="hr"></div><h3>Supervisor Verification</h3><div class="field full"><label>Igitekerezo (kirakenewe iyo usubije)</label><textarea id="hvNote" maxlength="800"></textarea></div><div class="inline" style="margin-top:8px"><button class="btn gold" onclick="hvSup(${r.id},1)">Genzura & wohereze kuri DDC</button><button class="btn light" onclick="hvSup(${r.id},0)">Subiza ku wayitanze</button></div>`;
  else if(isD()&&r.status==="Under Review")act=`<div class="hr"></div><h3>DDC Approval</h3>${r.dispute?`<div class="notice" style="background:#fef2f2;border-color:#fecaca;color:#7f1d1d">⚠ Hari Dispute ku bikoresho. Andika uko yakemuwe mbere yo kwemeza.</div>`:""}<div class="field full"><label>Impamvu / icyemezo (kirakenewe iyo usubije, wanze, cyangwa hari Dispute)</label><textarea id="hvNote" maxlength="800"></textarea></div><div class="inline" style="margin-top:8px"><button class="btn gold" onclick="hvDdc(${r.id},'approve')">Approve</button><button class="btn light" onclick="hvDdc(${r.id},'return')">Return for correction</button><button class="btn red" onclick="hvDdc(${r.id},'reject')">Reject</button></div>`;
 }
 const m=document.createElement("div");m.className="rm";m.id="hvmodal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.onclick=ev=>{if(ev.target===m)hvClose()};
 m.innerHTML=`<div class="rmc" style="max-width:920px"><div class="pagehead" style="margin-bottom:8px"><div><div class="eyebrow">${r.code} · ${r.type==="Transfer"?"Transfer & Replacement":"Daily Shift"}</div><h1 style="font-size:19px">${E(r.outName)} → ${E(r.inName)}</h1><p class="subtitle small">${E(d.post)} · ${E(fdt(d.at))}</p></div><div>${hvTag(r.status,r.dispute)}</div></div>
 <div class="hvs"><i>A</i>Umukozi & umusimbura</div><div class="tablewrap"><table style="min-width:420px"><tbody>${kv("Full Names / Staff ID",d.name+" · "+d.staffId)}${kv("Province / District / Sector / Cell",[d.prov,d.dist,d.sector,d.cell].join(" / "))}${kv("Incoming Officer",d.inName+" · "+(d.inStaff||"")+" · "+(d.inPos||""))}${kv("Duty Start",fdt(d.inStart))}${r.type==="Transfer"?kv("Transfer",(d.reason||"")+(d.newPost?" → "+d.newPost:"")):""}</tbody></table></div>
 <div class="hvs"><i>C</i>Raporo y’ibikorwa</div><div class="tablewrap"><table style="min-width:420px"><tbody>${kv("Inshingano zakozwe",d.done)}${kv("Ibikorwa bitararangira",r.tasks.map(t=>t.t).join(" • "))}${kv("Ibibazo byagaragaye",d.issues)}${kv("Raporo z’abaturage zitarakemuka",d.citizen)}${kv("Gukurikiranwa",d.followup)}${kv("Ibyifuzo ku musimbura",d.advice)}</tbody></table></div>
 <div class="hvs"><i>D</i>Ibikoresho</div><div class="tablewrap">${table(["Igikoresho","Ingano","Imiterere","Icyitonderwa"],r.assets.map(a=>[E(a.item),a.qty,`<span class="tag ${a.cond==="Imeze neza"?"green":a.cond==="Ntibijyanye"?"blue":"red"}">${a.cond}</span>`,E(a.note)||"—"]))}</div>
 <div class="hvs"><i>E</i>Amafoto n’inyandiko</div>${files}
 <div class="hvs"><i>F</i>Confirmations & ibyemezo</div><div class="tablewrap"><table style="min-width:420px"><tbody>${kv("Outgoing Officer",r.outConf?r.outConf.sig+" · "+r.outConf.time:"Ntaremeza")}${kv("Incoming Officer",r.inConf?({accept:"Accept Handover",remarks:"Accept with Remarks",reject:"Reject / Request Clarification"}[r.inConf.choice]||"")+" · "+r.inConf.sig+" · "+r.inConf.time+(r.inConf.remarks?" · "+r.inConf.remarks:""):"Itegereje")}${kv("Supervisor",r.sup?r.sup.by+" · "+r.sup.time+(r.sup.note?" · "+r.sup.note:""):"Itegereje")}${kv("DDC",r.ddc?r.ddc.decision+" · "+r.ddc.time+(r.ddc.reason?" · "+r.ddc.reason:""):"Itegereje")}</tbody></table></div>
 ${act}
 <div class="hr"></div><h3>Amateka (Audit trail — ntishobora gusibwa)</h3><div class="timeline">${r.trail.map(t=>`<div>${E(t)}</div>`).join("")}</div>
 <div class="hr"></div><button class="btn light" onclick="hvClose()">Funga</button></div>`;
 document.body.appendChild(m)};

/* ---------- reports ---------- */
window.hvCSV=function(){const L=list(),q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',h=["Code","Type","Status","Outgoing","Incoming","Post","District","Handover time","Dispute"];
 const csv="\uFEFF"+[h.map(q).join(",")].concat(L.map(r=>[r.code,r.type,r.status,r.outName,r.inName,r.d.post,r.d.dist,fdt(r.d.at),r.dispute?"Yes":"No"].map(q).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="handover_report.csv";document.body.appendChild(a);a.click();a.remove();log("Yakuyeho raporo ya Handover (CSV)")};
window.hvPrint=function(){const L=list(),w=window.open("","_blank");if(!w){toast("Emerera pop-up kugira ngo ufungure raporo yo gucapa.");return}
 w.document.write(`<!doctype html><meta charset="utf-8"><title>Handover Report</title><style>body{font:13px system-ui;padding:24px;color:#10261a}h1{color:#0f4d2a}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcd;padding:6px 8px;text-align:left}th{background:#e7f4ec}</style><h1>DASSO Handover Report</h1><p>${E(NOW())} · ${E(RN(state.role))}</p><table><tr><th>Code</th><th>Type</th><th>Status</th><th>Outgoing</th><th>Incoming</th><th>Post</th><th>Time</th></tr>${L.map(r=>`<tr><td>${r.code}</td><td>${r.type}</td><td>${r.status}${r.dispute?" (Dispute)":""}</td><td>${E(r.outName)}</td><td>${E(r.inName)}</td><td>${E(r.d.post)}</td><td>${E(fdt(r.d.at))}</td></tr>`).join("")}</table>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")hvClose()});

/* ---------- menu wiring ---------- */
const item={id:"handover",label:"Ihererekanya (Handover)",icon:"⇄",roles:["member",...SUPV,DDC,...VIEWERS]};
const at=menu.findIndex(m=>m.id==="docreq");if(at>=0)menu.splice(at+1,0,item);else menu.push(item);
{const f=dashboard;dashboard=function(){return state.page==="handover"&&item.roles.includes(state.role)?page():f()}}
{const o=window.renderNav;window.renderNav=function(){const l=item.label,n=item.roles.includes(state.role)?needCount():0;if(n)item.label=l+" ("+n+")";try{o()}finally{item.label=l}}}
})();
</script>
</body>
